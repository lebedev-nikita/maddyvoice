format: boxdb-schema
version: 1
pragmas:
  application_id: 1112496196
tables:
  jobs:
    columns:
      id: TEXT PRIMARY KEY
      channel: TEXT
      message_id: INTEGER
      audio_index: INTEGER
      published_at: TEXT
      source_url: TEXT
      caption: TEXT
      status: ENUM('pending', 'ready', 'uploading', 'uploaded', 'review') DEFAULT 'pending'
      origin: ENUM('live', 'history')
      attempts: INTEGER DEFAULT 0
      next_attempt: INTEGER DEFAULT 0
      error?: TEXT
      video_path?: TEXT
      video_sha256?: TEXT
      video_size?: INTEGER
      upload_session?: TEXT
      youtube_id?: TEXT
      created_at: TEXT
      updated_at: TEXT
      upload_privacy?: ENUM('private', 'public', 'unlisted')
      publication_privacy?: ENUM('private', 'public', 'unlisted')
      catchup_batch?: TEXT
    constraints:
      - unique: [channel, message_id, audio_index]
  sources:
    columns:
      channel: TEXT PRIMARY KEY
      cursor: INTEGER
      checked_at: TEXT
  title_caption_budget:
    columns:
      day: TEXT PRIMARY KEY
      checks: INTEGER DEFAULT 0
  video_titles:
    columns:
      job_id: TEXT PRIMARY KEY REFERENCES jobs(id)
      video_id: TEXT
      status: ENUM('pending', 'applied', 'manual', 'review') DEFAULT 'pending'
      transcript?: TEXT
      topic?: TEXT
      title?: TEXT
      attempts: INTEGER DEFAULT 0
      next_attempt: INTEGER DEFAULT 0
      error?: TEXT
      created_at: TEXT
      updated_at: TEXT
      generation_version: INTEGER DEFAULT 0
      thumbnail_quote?: TEXT
      tags?: TEXT[]
indexes:
  jobs_pending:
    type: regular
    table: jobs
    expressions:
      - status
      - next_attempt
      - published_at
  video_titles_pending:
    type: regular
    table: video_titles
    expressions:
      - status
      - next_attempt
