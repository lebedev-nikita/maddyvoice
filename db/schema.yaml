format: boxdb-schema
version: 1
pragmas:
  application_id: 1112496196
tables:
  jobs:
    columns:
      id: TEXT PRIMARY KEY
      channel: TEXT
      message_id: INTEGER
      audio_index: INTEGER
      published_at: TEXT
      source_url: TEXT
      caption: TEXT
      status: ENUM('pending', 'ready', 'uploading', 'uploaded', 'review') DEFAULT 'pending'
      origin: ENUM('live', 'history')
      attempts: INTEGER DEFAULT 0
      next_attempt: INTEGER DEFAULT 0
      error?: TEXT
      video_path?: TEXT
      video_sha256?: TEXT
      video_size?: INTEGER
      upload_session?: TEXT
      youtube_id?: TEXT
      created_at: TEXT
      updated_at: TEXT
      upload_privacy?: ENUM('private', 'public', 'unlisted')
    constraints:
      - unique: [channel, message_id, audio_index]
  sources:
    columns:
      channel: TEXT PRIMARY KEY
      cursor: INTEGER
      checked_at: TEXT
  title_caption_budget:
    columns:
      day: TEXT PRIMARY KEY
      checks: INTEGER DEFAULT 0
  video_titles:
    columns:
      job_id: TEXT PRIMARY KEY REFERENCES jobs(id)
      video_id: TEXT
      status: ENUM('pending', 'applied', 'manual', 'review') DEFAULT 'pending'
      transcript?: TEXT
      topic?: TEXT
      title?: TEXT
      attempts: INTEGER DEFAULT 0
      next_attempt: INTEGER DEFAULT 0
      error?: TEXT
      created_at: TEXT
      updated_at: TEXT
indexes:
  jobs_pending:
    type: regular
    table: jobs
    expressions:
      - status
      - next_attempt
      - published_at
  video_titles_pending:
    type: regular
    table: video_titles
    expressions:
      - status
      - next_attempt
migrations:
  - version: "20261027000000"
    name: queue
    checksum: fb6236192465d9873728dc804d7011ebc51d15fe1ccb06fe4e8f60c501a0ff46
  - version: "20261027000001"
    name: upload_privacy
    checksum: 9d110869f6e5527d3fddea576af288b0a99620b7b68dbec33668a58f0fcea5e6
  - version: "20261027000002"
    name: video_titles
    checksum: 5ae1ac82051b91701bcdd106f48300bd52a8e2e39bc8cb046ecec5c4f91f299c
