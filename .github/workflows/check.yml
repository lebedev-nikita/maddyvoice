name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # The media smoke test renders the post card with the runner's Google Chrome,
      # whose sandbox needs unprivileged user namespaces.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bunx tsgo --noEmit
      - run: bun run test
      - run: bun scripts/+media-smoke.ts
      - run: bun run analyze
      - run: bun run build
